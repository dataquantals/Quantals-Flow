  <!-- ============ HEADER / NAV ============ -->
  <header class="header" id="header">
    <div class="header__inner">
      <a class="logo" href="/" aria-label="QuantalFlow home">
        <img class="logo__mark" src="/assets/img/logo.png" width="32" height="32" alt="" />
        <span class="logo__word">QuantalFlow</span>
      </a>

      <div class="header__actions" id="header-auth-controls">
        <a class="header__link" href="/login/" id="header-signin-link" data-auth-signed-out>Login</a>
        <a class="btn btn--dark header__cta" href="/get-started/" id="header-signup-link" data-auth-signed-out>Get started free</a>
        <a class="header__link" href="/dashboard/" id="header-dashboard-link" data-auth-signed-in hidden>Dashboard</a>
        <a class="header__link header__link--profile" href="/profile/" id="header-profile-link" data-auth-signed-in hidden>
          <span class="dash-profile-avatar header__avatar" id="header-profile-initial">&mdash;</span>
          <span id="header-profile-name">Profile</span>
        </a>
        <div class="header__user" id="header-user-button" data-auth-signed-in hidden></div>
      </div>

      <button class="burger" id="burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
        <span></span><span></span><span></span>
      </button>
    </div>

    <!-- mobile drawer -->
    <div class="drawer" id="drawer" hidden>
      <a href="/dashboard/" data-auth-signed-in hidden>Dashboard</a>
      <a class="drawer__profile" href="/profile/" data-auth-signed-in hidden>
        <span class="dash-profile-avatar header__avatar header__avatar--sm" id="drawer-profile-initial">&mdash;</span>
        <span id="drawer-profile-name">Profile</span>
      </a>
      <div class="drawer__user" id="drawer-user-button" data-auth-signed-in hidden></div>
      <a href="/login/" data-auth-signed-out>Login</a>
      <a class="btn btn--dark" href="/get-started/" data-auth-signed-out>Get started free</a>
    </div>
  </header>
